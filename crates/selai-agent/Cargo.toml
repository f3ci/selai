[package]
name = "selai-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
selai-audit = { version = "0.4.2", path = "../selai-audit" }
selai-domain = { version = "0.4.2", path = "../selai-domain" }
selai-llm = { version = "0.4.2", path = "../selai-llm" }
selai-policy = { version = "0.4.2", path = "../selai-policy" }
selai-secrets = { version = "0.4.2", path = "../selai-secrets" }
selai-ssh = { version = "0.4.2", path = "../selai-ssh" }
selai-storage = { version = "0.4.2", path = "../selai-storage" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
wiremock = "0.6"
