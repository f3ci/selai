name: Release packaging

# Builds the desktop installers on Linux, Windows and macOS and uploads them as
# workflow artifacts, together with SHA256SUMS and CycloneDX SBOMs. On a `v*` tag
# push it also attests build provenance and publishes a GitHub release with the
# installers (0.x and suffixed versions as pre-releases). It never creates a tag
# or a PR. macOS uses ad-hoc signing unless Apple signing secrets are set;
# other installers are unsigned without their optional signing secrets.
# See docs/release/packaging.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Release dependency audit and packaging tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Packaging regression tests
        run: node --test scripts/release/packaging.test.mjs
      - name: Frontend dependency audit
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high

  package:
    name: Installers (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macos
            macos_arch: arm64
            macos_package_arch: aarch64
          - os: macos-15-intel
            platform: macos-intel
            macos_arch: x86_64
            macos_package_arch: x64
    steps:
      - uses: actions/checkout@v4

      # The secrets context is not allowed in step conditions, so the presence of
      # each optional secret is stored as a boolean output. Values are never printed.
      - name: Detect optional Windows signing secret
        id: signing
        env:
          WINDOWS_CERTIFICATE_SET: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: echo "windows=$WINDOWS_CERTIFICATE_SET" >> "$GITHUB_OUTPUT"

      - name: Linux system libraries for Tauri
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev \
            libsecret-1-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            openssh-server gnome-keyring
      - uses: dtolnay/rust-toolchain@stable
      - name: Native crypto build tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl nasm --no-progress -y
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # openssl-src builds OpenSSL from source and reads this variable. Without it,
          # the Perl on PATH is Git for Windows' MSYS Perl, which lacks the modules.
          "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # `-- --locked` passes --locked to cargo.
      # Linux builds deb and AppImage only. rpm is left out.
      - name: Build installers (Linux)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: >-
          pnpm tauri build --ci
          --bundles deb appimage
          -- --locked

      - name: Build installers (Windows)
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: >-
          pnpm tauri build --ci
          -- --locked

      # Exercise the native Windows encryption path in the same release profile
      # as the MSI. A successfully bundled but crashing vault must not be uploaded.
      - name: Validate Windows vault before publishing installers
        if: matrix.platform == 'windows'
        run: |
          cargo test --release --locked -p selai-storage encrypted_memory_security_does_not_reenter_native_logging
          cargo test --release --locked -p selai-vault --test vault -- --test-threads=1
          cargo test --release --locked -p selai-desktop --lib vault_service::tests -- --test-threads=1
      # Optional Apple Developer ID signing and notarization. Without an identity,
      # tauri.conf.json defaults to ad-hoc signing for Apple Silicon compatibility.
      # Tauri reads these variables itself.
      # A variable whose secret is empty is unset, because Tauri treats an empty
      # string as configured and would then try to use it.
      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!v}" ]]; then unset "$v"; fi
          done
          pnpm tauri build --ci \
            -- --locked

      - name: Verify macOS app architecture and signature before publishing installers
        if: runner.os == 'macOS'
        env:
          EXPECTED_MACOS_ARCH: ${{ matrix.macos_arch }}
        run: |
          app=target/release/bundle/macos/Selai.app
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo -verify_arch "$EXPECTED_MACOS_ARCH" "$app/Contents/MacOS/$executable"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Sign Windows installers (only when WINDOWS_CERTIFICATE is set)
        if: matrix.platform == 'windows' && steps.signing.outputs.windows == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release/sign-windows.ps1
          -BundleDir target/release/bundle

      - name: Check frontend and Windows package size budgets
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            node scripts/ci/check-size-budget.mjs --windows
          else
            node scripts/ci/check-size-budget.mjs
          fi

      - name: Stage installers and write SHA256SUMS (Linux and macOS)
        if: matrix.platform != 'windows'
        env:
          MACOS_PACKAGE_ARCH: ${{ matrix.macos_package_arch }}
        run: bash scripts/release/collect-bundles.sh target/release/bundle stage "$MACOS_PACKAGE_ARCH"

      - name: Stage installers and write SHA256SUMS (Windows)
        if: matrix.platform == 'windows'
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release/collect-bundles.ps1
          -BundleDir target/release/bundle -StageDir stage

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          path: stage/
          if-no-files-found: error

  sbom:
    name: SBOM (Rust workspace and frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned version. --locked keeps cargo-cyclonedx's own dependencies fixed.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Generate SBOMs
        run: bash scripts/release/generate-sbom.sh sbom
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  attest:
    name: Build provenance attestation
    needs: [package, sbom, validate]
    # Runs only for tag pushes. The permissions below apply to this job only.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # Without a name, every artifact is downloaded into its own subdirectory.
      - name: Download installers and SBOMs
        uses: actions/download-artifact@v8
        with:
          path: release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/installers-linux/*
            release/installers-windows/*
            release/installers-macos/*
            release/installers-macos-intel/*
            release/sbom/*

  publish:
    name: Publish GitHub release
    needs: [package, sbom, attest, validate]
    # Tag pushes only, after every installer and the SBOMs were built. The
    # attestation is waited for but not required: on a private repository
    # without GitHub Enterprise Cloud it is unavailable, and the release notes
    # then do not claim it.
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.package.result == 'success' && needs.sbom.result == 'success' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download installers and SBOMs
        uses: actions/download-artifact@v8
        with:
          path: release
      - name: Check the artifacts and assemble the release files
        run: bash scripts/release/assemble-release.sh release dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ATTESTED: ${{ needs.attest.result == 'success' }}
        run: |
          cp docs/release/RELEASE_NOTES.md notes.md
          if [[ "$ATTESTED" == "true" ]]; then
            {
              echo
              echo "Each file has a signed build provenance attestation:"
              echo "\`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            } >> notes.md
          fi
          flags=()
          # 0.x versions and versions with a suffix (v1.0.0-rc.1) are pre-releases.
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Selai ${TAG#v}" \
            --notes-file notes.md \
            "${flags[@]}"
