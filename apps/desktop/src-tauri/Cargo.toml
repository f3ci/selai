[package]
name = "selai-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Selai desktop application (Tauri composition root)"

[lib]
name = "selai_desktop_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keepass = "0.15.2"
zeroize = "1"
portable-pty = "0.9.0"
selai-agent = { version = "0.3.2", path = "../../../crates/selai-agent" }
selai-audit = { version = "0.3.2", path = "../../../crates/selai-audit" }
selai-domain = { version = "0.3.2", path = "../../../crates/selai-domain" }
selai-llm = { version = "0.3.2", path = "../../../crates/selai-llm" }
selai-policy = { version = "0.3.2", path = "../../../crates/selai-policy" }
selai-secrets = { version = "0.3.2", path = "../../../crates/selai-secrets" }
selai-ssh = { version = "0.3.2", path = "../../../crates/selai-ssh" }
selai-storage = { version = "0.3.2", path = "../../../crates/selai-storage" }
selai-vault = { version = "0.3.2", path = "../../../crates/selai-vault" }
selai-platform = { version = "0.3.2", path = "../../../crates/selai-platform" }
rfd = "0.15"
fs2 = "0.4.3"
sha2 = "0.11"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
semver = "1"
webbrowser = { version = "1", features = ["hardened"] }
russh = "0.64.1"
russh-sftp = "2.4.0"
ssh-key = { version = "=0.7.0-rc.11", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros", "io-util", "process"] }
tokio-util = "0.7"
tempfile = "3.27.0"

[lints]
workspace = true

[dev-dependencies]
selai-testkit = { version = "0.3.2", path = "../../../crates/selai-testkit" }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
wiremock = "0.6"
