[workspace]
resolver = "2"
members = ["crates/selai-domain", "crates/selai-storage", "apps/desktop/src-tauri", "crates/selai-secrets", "crates/selai-ssh", "crates/selai-llm", "crates/selai-testkit", "crates/selai-policy", "crates/selai-audit", "crates/selai-agent", "crates/selai-vault", "crates/selai-platform"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/f3ci/selai"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
